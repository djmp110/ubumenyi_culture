{% extends "base.html" %}
{% load static %}
{% block title %}Check Your Email — Ubumenyi Hub{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card" style="text-align: center;">
    <h1>Check your email</h1>
    <p>We've sent a password reset link to your email. Click the link to continue.</p>
    <p style="font-size: 13px; color: var(--muted); margin-top: 20px;">
      Didn't get an email? Check your spam folder, or <a href="{% url 'password_reset' %}">try again</a>.
    </p>
  </div>
</section>
{% endblock %}
