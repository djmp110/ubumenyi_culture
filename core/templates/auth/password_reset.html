{% extends "base.html" %}
{% load static %}
{% block title %}Reset Password — Ubumenyi Hub{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <h1>Reset password</h1>
    <p>Enter your email and we'll send you a reset link.</p>

    <form method="post">
      {% csrf_token %}
      <p>
        <label for="id_email">Email address</label>
        <input type="email" name="email" id="id_email" required>
      </p>
      <button class="btn-primary btn-wide">Send reset link</button>
    </form>

    <p class="auth-note"><a href="{% url 'login' %}">← Back to sign in</a></p>
  </div>
</section>
{% endblock %}
