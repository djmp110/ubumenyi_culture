{% extends "base.html" %}
{% load static %}
{% block title %}New Discussion — Ubumenyi Hub{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/forum.css' %}">
{% endblock %}

{% block content %}
<section class="forum-topic-page">
  <a href="{% url 'forum' %}" class="breadcrumb">← Back to forum</a>
  <h1>Start a discussion</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn-primary">Publish</button>
  </form>
</section>
{% endblock %}
